<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>隨機播放 YouTube 影片</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: black;
    }
    iframe {
      width: 100vw;
      height: 100vh;
      border: none;
    }
  </style>
</head>
<body>
  <script>
    const videoIds = [
      "hw2xgPhDF2M",  // 替換成你嘅 YouTube ID
      "RMyhDWaEID8",
      "0ZCTG1OwTt8"
      "jOWQIb0dos8",
      "Gt8bQjGTvtQ"
      "K2sWNTvDLkU",
      "yi5jMjBxElQ"
      "JOBIK1tOKnk",
      "vP2YbtEzICw"
      
    ];

    const randomIndex = Math.floor(Math.random() * videoIds.length);
    const selectedId = videoIds[randomIndex];
    const url = `https://www.youtube.com/embed/${selectedId}?autoplay=1&loop=1&playlist=${selectedId}&mute=1&controls=0`;

    document.write(`<iframe src="${url}" allow="autoplay; fullscreen"></iframe>`);
  </script>
</body>
</html>
